<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGILA APP - SMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:white;padding:15px}
.header{text-align:center;padding:20px;border:2px solid #ff0000;border-radius:15px;background:#1a1a1a;margin-bottom:15px}
.header h1{color:#ff0000;font-size:42px;letter-spacing:2px}
.config{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:15px;margin-bottom:15px}
.config h3{color:#ff0000;font-size:15px;margin-bottom:10px}
.config input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#000;color:white;margin-bottom:10px;font-size:14px}
.config button{width:100%;padding:12px;background:#ff0000;color:white;border:none;border-radius:8px;font-weight:bold;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:15px}
.btn{padding:18px 8px;border:none;border-radius:12px;color:white;font-weight:bold;font-size:12px;min-height:90px}
.b1{background:#c70000} .b2{background:#ff6a00} .b3{background:#0066ff}
.b4{background:#6a00ff} .b5{background:#009688} .b6{background:#ff9800}
.info{background:#000;border:1px solid #0f0;color:#0f0;padding:10px;border-radius:8px;text-align:center;font-size:12px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="header">
<h1>VIGILA</h1>
<p>🛡️ BOTÃO DE SEGURANÇA 24H<br>Funciona com SMS - SEM INTERNET</p>
</div>

<div class="config">
<h3>⚙️ SEUS CONTATOS DE EMERGÊNCIA</h3>
<input id="c1" placeholder="Contato 1 - Ex: 12988361033">
<input id="c2" placeholder="Contato 2 - Ex: 11999999999">
<input id="c3" placeholder="Contato 3 - Ex: 190">
<button onclick="salvar()">💾 SALVAR CONTATOS</button>
<div id="msg" class="info"></div>
</div>

<div class="grid">
<button class="btn b1" onclick="emergencia('ABUSO MULHER','180')">1️⃣ ABUSO DE MULHERES</button>
<button class="btn b2" onclick="emergencia('ABUSO CRIANCAS','100')">2️⃣ ABUSO DE CRIANÇAS</button>
<button class="btn b3" onclick="emergencia('EMERGENCIA FAMILIAR','190')">3️⃣ EMERGÊNCIA FAMILIAR</button>
<button class="btn b4" onclick="emergencia('VANDALISMO','190')">4️⃣ CONTRA VANDALISMO</button>
<button class="btn b5" onclick="emergencia('DEPREDACAO','190')">5️⃣ CONTRA DEPREDACAO</button>
<button class="btn b6" onclick="emergencia('PERTURBACAO','190')">6️⃣ CONTRA PERTURBACAO</button>
</div>

<div style="text-align:center;padding:10px;background:#1a1a1a;border-radius:10px">
<p style="font-size:11px;color:#aaa">✅ Funciona sem internet via SMS<br>✅ Com internet tenta WhatsApp também</p>
<p style="font-size:12px;color:#ff0000;margin-top:8px;font-weight:bold">EMERGÊNCIA: 190 Polícia | 180 Mulher</p>
</div>

<script>
function carregar(){
 c1.value=localStorage.getItem('vigila_c1')||'12988361033';
 c2.value=localStorage.getItem('vigila_c2')||'';
 c3.value=localStorage.getItem('vigila_c3')||'';
}
function salvar(){
 localStorage.setItem('vigila_c1',c1.value);
 localStorage.setItem('vigila_c2',c2.value);
 localStorage.setItem('vigila_c3',c3.value);
 mostrar('✅ CONTATOS SALVOS! Agora funciona sem internet!');
 if(navigator.vibrate) navigator.vibrate(200);
}
function mostrar(t){
 msg.style.display='block'; msg.innerText=t;
 setTimeout(()=>msg.style.display='none',4000);
}
function emergencia(tipo, oficial){
 const contatos=[c1.value,c2.value,c3.value].filter(x=>x);
 if(contatos.length==0){alert('⚠️ Configure os contatos primeiro!');return;}
 mostrar('📡 Pegando GPS... Permita localização');
 navigator.geolocation.getCurrentPosition(p=>{
   const link=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
   enviarSMS(tipo, link, oficial);
 }, err=>{
   enviarSMS(tipo, 'GPS DESLIGADO - Ative GPS!', oficial);
 }, {enableHighAccuracy:true,timeout:8000});
}
function enviarSMS(tipo, local, oficial){
 const hora=new Date().toLocaleString();
 const texto=`VIGILA EMERGENCIA! ${tipo} - Preciso ajuda! Local: ${local} Hora: ${hora} - Me ajude!`;
 const nums=[c1.value,c2.value,c3.value].map(v=>v.replace(/\D/g,'')).filter(n=>n.length>=8);
 if(nums.length==0){alert(texto);return;}
 
 // 1 - Tenta SMS (funciona sem internet)
 const smsNumero=nums[0];
 const smsLink=`sms:${smsNumero}?body=${encodeURIComponent(texto)}`;
 window.location.href=smsLink;
 
 mostrar(`🚨 Abrindo SMS para ${smsNumero} - Clique em ENVIAR no SMS!`);
 if(navigator.vibrate) navigator.vibrate([300,100,300,100,500]);

 // 2 - Se tiver internet, 2 segundos depois tenta WhatsApp também
 setTimeout(()=>{
   if(navigator.onLine && confirm(`SMS aberto para ${smsNumero}. Tentar enviar também por WhatsApp?`)){
     window.open(`https://wa.me/55${nums[0]}?text=${encodeURIComponent(texto)}`,'_blank');
   }
 },2000);
}
carregar();
</script>
</body>
</html>
