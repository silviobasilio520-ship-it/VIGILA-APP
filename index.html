<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIGILA</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:15px;text-align:center}h1{color:red;font-size:38px;border:2px solid red;border-radius:15px;padding:15px}input{width:100%;padding:15px;font-size:18px;border-radius:8px;margin:10px 0}button{width:100%;padding:16px;background:red;color:#fff;border:none;border-radius:10px;font-weight:bold;margin:5px 0;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style>
</head>
<body>
<h1>VIGILA</h1>
<input id="tel" value="12988361033" placeholder="Número com DDD">
<div class="grid">
<button onclick="enviar('ABUSO MULHER')">1 ABUSO MULHER</button>
<button onclick="enviar('ABUSO CRIANCA')">2 ABUSO CRIANCA</button>
<button onclick="enviar('EMERGENCIA FAMILIAR')">3 EMERG FAMILIAR</button>
<button onclick="enviar('VANDALISMO')">4 VANDALISMO</button>
<button onclick="enviar('DEPREDACAO')">5 DEPREDACAO</button>
<button onclick="enviar('PERTURBACAO')">6 PERTURBACAO</button>
</div>
<div id="s" style="margin-top:15px;color:#0f0"></div>
<script>
function enviar(tipo){
 let n=tel.value.replace(/\D/g,'');
 if(n.length<10){alert('Digite número');return;}
 s.innerText='📡 Pegando GPS... permita localização';
 navigator.geolocation.getCurrentPosition(p=>{
  let loc=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
  let txt=`VIGILA ${tipo} SOCORRO! Local: ${loc} Hora: ${new Date().toLocaleString()}`;
  window.location.href=`sms:${n}?body=${encodeURIComponent(txt)}`;
  s.innerText='✅ Abrindo SMS... clique em ENVIAR no SMS';
 },()=>{alert('Ative seu GPS do celular e permita localização'); s.innerText='Ative GPS';},{enableHighAccuracy:true});
}
</script>
</body>
</html>
